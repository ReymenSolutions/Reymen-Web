server {
  listen 80;
  # www → reymen.mx (una sola dirección para buscadores)
  if ($host = www.reymen.mx) { return 301 https://reymen.mx$request_uri; }
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  # CSP: todo propio salvo Plausible (analítica) y la API pública de ReymenApp (formulario y chat). 'unsafe-inline' porque Astro
  # incrusta scripts y estilos pequeños; se puede pasar a hashes más adelante. Si se agrega otro origen externo, hay que listarlo aquí.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://app.reymen.mx https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location / { try_files $uri $uri.html $uri/ =404; }
  location ~* \.(css|js|svg|png|jpg|webp|woff2)$ { expires 1d; add_header Cache-Control "public"; }
}
